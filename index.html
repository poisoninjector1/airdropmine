<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Mining Bot</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .balance { font-size: 32px; color: #00ff88; font-weight: bold; }
        .speed { font-size: 16px; color: #aaa; margin-top: 5px; }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>⚡ Virtual Miner Mini App</h2>
    
    <div class="card">
        <div>Your Balance</div>
        <div class="balance" id="balance">0.0000</div>
        <div class="speed">Speed: <span id="speed">1.0</span> Points/hr</div>
    </div>

    <button onclick="shareReferral()">Invite Friend (+10% Speed)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Fullscreen expansion

        // Telegram WebApp user identity
        const user = tg.initDataUnsafe?.user || { id: 99999, username: "DemoUser" };
        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('ref');

        // Replace with your live Backend URL (e.g., ngrok or VPS URL)
        const BACKEND_URL = "http://127.0.0.1:8000";

        async function syncData() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        username: user.username || "",
                        referrer_id: referrerId ? parseInt(referrerId) : null
                    })
                });
                const data = await response.json();
                
                document.getElementById('balance').innerText = data.balance.toFixed(4);
                document.getElementById('speed').innerText = data.mining_speed.toFixed(1);
            } catch (err) {
                console.error("Backend Connection Error:", err);
            }
        }

        function shareReferral() {
            const refLink = `https://t.me/YOUR_BOT_USERNAME?start=ref_${user.id}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=Join my mining squad and boost speed!`);
        }

        // Sync initially and update UI
        syncData();
        setInterval(syncData, 10000); // 10 sec পর পর অটো সিঙ্ক
    </script>
</body>
</html>
