<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nerd Coin Mining App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect Web3 SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.7);
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger-color: #ff4757;
            --success-color: #2ed573;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.15), transparent 70%);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 14, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--accent-gradient); display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: #fff;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .username { font-weight: 600; font-size: 14px; }
        .status-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffa500; }
        .status-online .status-dot { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .status-offline .status-dot { background: var(--danger-color); }

        main { flex: 1; padding: 20px; padding-bottom: 90px; display: flex; flex-direction: column; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out forwards; }
        .tab-content.active { display: flex; flex-direction: column; gap: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .balance-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 25px 20px; text-align: center;
            backdrop-filter: blur(15px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative; overflow: hidden;
        }

        .balance-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; }
        .balance-amount {
            font-family: 'Orbitron', sans-serif; font-size: 38px; font-weight: 900;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; text-align: center; }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; color: var(--accent-color); }

        .tap-area { display: flex; justify-content: center; align-items: center; margin: 20px 0; position: relative; }
        .coin-btn {
            width: 180px; height: 180px; border-radius: 50%;
            background: radial-gradient(circle, #00f2fe 0%, #0066ff 70%, #001133 100%);
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.1s ease;
        }
        .coin-btn:active { transform: scale(0.95); }
        .coin-btn i { font-size: 70px; color: #fff; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)); }

        .section-header { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .task-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

        .btn {
            padding: 12px 16px; border-radius: 12px; border: none;
            background: var(--accent-gradient); color: #fff; font-weight: 600; font-size: 13px;
            cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; box-shadow: 0 4px 12px rgba(0, 198, 255, 0.3); transition: opacity 0.2s; width: 100%;
        }
        .btn-withdraw { background: linear-gradient(135deg, #0088cc 0%, #005588 100%); margin-top: 15px; }

        #ton-connect-btn { display: flex; justify-content: center; margin-bottom: 15px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-group label { font-size: 12px; color: var(--text-muted); }
        .form-control { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }

        nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(11, 14, 20, 0.9); backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; cursor: pointer; width: 20%; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--accent-color); }
        #nav-admin { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="avatar" id="user-avatar">U</div>
            <div>
                <div class="username" id="user-name">Loading...</div>
                <div style="font-size: 10px; color: var(--text-muted);" id="user-handle">@----</div>
            </div>
        </div>
        <div class="status-badge status-offline" id="api-status">
            <div class="status-dot"></div>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <main>
        <!-- Home / Mining -->
        <div id="tab-home" class="tab-content active">
            <div class="balance-card">
                <div class="balance-title">Total Balance</div>
                <div class="balance-amount">
                    <i class="fa-solid fa-coins"></i>
                    <span id="balance">0.00</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Mining Speed</div>
                        <div class="stat-value"><span id="speed">10.0</span> / sec</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Min. Withdraw</div>
                        <div class="stat-value">100 Coins</div>
                    </div>
                </div>

                <!-- TON Connect Button -->
                <div id="ton-connect-btn" style="margin-top: 15px;"></div>

                <button class="btn btn-withdraw" onclick="processWithdrawal()">
                    <i class="fa-solid fa-wallet"></i> Withdraw (10% Fee)
                </button>
            </div>

            <div class="tap-area">
                <div class="coin-btn" id="coin-tap">
                    <i class="fa-solid fa-bolt"></i>
                </div>
            </div>
        </div>

        <!-- Tasks Tab -->
        <div id="tab-tasks" class="tab-content">
            <div class="section-header">
                <i class="fa-solid fa-list-check" style="color: var(--accent-color);"></i>
                Available Missions
            </div>
            <div id="tasks-list">
                <div class="task-card">
                    <div>
                        <div style="font-size: 14px; font-weight: 600;">Join Official Telegram</div>
                        <div style="font-size: 12px; color: #ffd700;"><i class="fa-solid fa-coins"></i> +5,000 NERD</div>
                    </div>
                    <a href="https://t.me/" target="_blank" class="btn" style="width: auto;">Start</a>
                </div>
            </div>
        </div>

        <!-- Friends Tab -->
        <div id="tab-friends" class="tab-content">
            <div class="balance-card">
                <div class="balance-title">Your Invite Link</div>
                <div style="margin: 10px 0;">
                    <input type="text" id="ref-link" class="form-control" readonly value="Loading invite link...">
                </div>
                <button class="btn" style="background: linear-gradient(135deg, #2ed573 0%, #26af5f 100%);" onclick="copyRefLink()">
                    <i class="fa-solid fa-copy"></i> Copy Link
                </button>
            </div>
        </div>

        <!-- Admin Tab -->
        <div id="tab-admin" class="tab-content">
            <div class="section-header">
                <i class="fa-solid fa-user-shield" style="color: var(--danger-color);"></i>
                Admin Dashboard
            </div>
            <div class="balance-card" style="text-align: left;">
                <div class="form-group">
                    <label>Broadcast Message</label>
                    <textarea id="admin-broadcast-msg" class="form-control" rows="3" placeholder="Type notification message..."></textarea>
                </div>
                <button class="btn" onclick="sendBroadcast()">Send Broadcast</button>
            </div>
        </div>
    </main>

    <nav>
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><i class="fa-solid fa-list-check"></i><span>Tasks</span></div>
        <div class="nav-item" onclick="switchTab('friends', this)"><i class="fa-solid fa-user-plus"></i><span>Friends</span></div>
        <div class="nav-item" id="nav-admin" onclick="switchTab('admin', this)"><i class="fa-solid fa-shield-halved"></i><span>Admin</span></div>
    </nav>

    <script>
        const BACKEND_URL = "https://airdropbackend-w8zk.onrender.com";
        const ADMIN_USERNAME = "JohnRipper1337"; 
        
        // IMPORTANT: আপনার আসল TON Wallet অ্যাড্রেস নিচে বসাবেন (যাতে ১০% কমিশন ঢুকবে)
        const COMMUNITY_WALLET = "UQCccW_yUBX_tdJ351zRRadmDZ4mpaaohrwOMgd7HhRNapiW"; 

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const user = tg?.initDataUnsafe?.user || { id: 99999, first_name: "John", username: "JohnRipper1337" };
        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('start') || tg?.initDataUnsafe?.start_param || null;

        let currentBalance = 0;
        let speedPerSec = 10;
        let isApiConnected = false;

        // TON Connect UI Integration
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-community/ton-connect-manifest/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        document.addEventListener('DOMContentLoaded', () => {
            setupUserInfo();
            checkAdminAccess();
            syncData();
            setInterval(syncData, 10000);
        });

        function setupUserInfo() {
            document.getElementById('user-name').innerText = user.first_name || "Guest";
            document.getElementById('user-handle').innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;
            document.getElementById('user-avatar').innerText = (user.first_name || "G").charAt(0).toUpperCase();
            document.getElementById('ref-link').value = `https://t.me/@nerdminerpoolsok_bot?start=ref_${user.id}`;
        }

        function checkAdminAccess() {
            if (user && user.username && user.username.replace('@', '').toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                document.getElementById('nav-admin').style.display = 'flex';
            }
        }

        function switchTab(tabName, elem) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            elem.classList.add('active');
        }

        async function syncData() {
            const statusElem = document.getElementById('api-status');
            const statusText = document.getElementById('status-text');

            let userId = user && user.id ? parseInt(user.id) : 99999;
            let refId = null;
            if (referrerId) {
                let parsed = parseInt(String(referrerId).replace('ref_', ''));
                if (!isNaN(parsed)) refId = parsed;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        username: user.username || user.first_name || "Guest",
                        referrer_id: refId,
                        wallet_address: tonConnectUI.account ? tonConnectUI.account.address : null
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentBalance = parseFloat(data.balance) || 0;
                    speedPerSec = parseFloat(data.mining_speed) || 10;
                    document.getElementById('balance').innerText = currentBalance.toFixed(2);
                    document.getElementById('speed').innerText = speedPerSec.toFixed(1);
                    statusElem.className = "status-badge status-online";
                    statusText.innerText = "Online";
                    isApiConnected = true;
                } else { throw new Error("Server error"); }
            } catch (err) {
                statusElem.className = "status-badge status-offline";
                statusText.innerText = "Offline";
                isApiConnected = false;
            }
        }

        document.getElementById('coin-tap').addEventListener('click', () => {
            currentBalance += 1;
            document.getElementById('balance').innerText = currentBalance.toFixed(2);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // ================= AUTOMATIC 10% FEE WITHDRAWAL =================
        async function processWithdrawal() {
            if (!tonConnectUI.connected) {
                alert("Please connect your TON Wallet first using the Connect button!");
                tonConnectUI.openModal();
                return;
            }

            if (currentBalance < 100) {
                alert("Minimum withdrawal is 100 Coins!");
                return;
            }

            const userWalletAddress = tonConnectUI.account.address;
            
            // ধরুন ১,০০০ কয়েন = ০.১ TON
            const totalTON = (currentBalance / 10000); 
            const communityCommission = (totalTON * 0.10); // ১০% কমিশন আপনার জন্য
            const userNetPayout = (totalTON * 0.90);       // ৯০% নেট উইথড্র ইউজারের জন্য

            // NanoTON Convert (1 TON = 1,000,000,000 NanoTON)
            const userAmountNano = Math.floor(userNetPayout * 1000000000).toString();
            const communityAmountNano = Math.floor(communityCommission * 1000000000).toString();

            try {
                // ২ টি ট্রানজেকশন অটোমেটিক একসাথে ঘটবে
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 60,
                    messages: [
                        {
                            address: userWalletAddress,   // ৯০% রিওয়ার্ড ইউজারের অ্যাকাউন্টে
                            amount: userAmountNano
                        },
                        {
                            address: COMMUNITY_WALLET,    // ১০% কমিশন কমিউনিটির অ্যাকাউন্টে
                            amount: communityAmountNano
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                alert("Withdrawal successful! 10% community fee transferred automatically.");
                
                // ব্যালেন্স জিরো করে সিঙ্ক দিন
                currentBalance = 0;
                document.getElementById('balance').innerText = "0.00";
                syncData();

            } catch (error) {
                console.error("Transaction Error:", error);
                alert("Transaction canceled or failed!");
            }
        }

        function copyRefLink() {
            const input = document.getElementById('ref-link');
            input.select();
            document.execCommand('copy');
            alert('Referral link copied!');
        }
    </script>
</body>
</html>
